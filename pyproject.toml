[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blob-viewer"
version = "0.1.4"
description = "A personal S3/MinIO bucket browser and file previewer. Desktop app (pywebview) and server, with a local download cache, multiple workspaces and a guided CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jason Jiménez Cruz", email = "jasonjimenezcruz@gmail.com" },
]
keywords = ["s3", "minio", "blob", "viewer", "boto3", "pywebview", "file-preview", "bucket-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "flask>=3.1",
    "boto3>=1.35",
    "cryptography>=43.0",
    "rich>=13.9",
    "waitress>=3.0",
    "pywebview>=5.4; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "hatchling>=1.27",
    "build>=1.2",
    "twine>=6.0",
    "markdown>=3.7",
]

[project.urls]
Homepage = "https://github.com/jasonjimnz/blob-viewer"
Documentation = "https://github.com/jasonjimnz/blob-viewer#readme"
Repository = "https://github.com/jasonjimnz/blob-viewer"
Issues = "https://github.com/jasonjimnz/blob-viewer/issues"
Changelog = "https://github.com/jasonjimnz/blob-viewer/blob/main/CHANGELOG.md"

[project.scripts]
blob-viewer = "blob_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blob_viewer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/blob_viewer",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: end-to-end tests that require Docker (MinIO)",
]
